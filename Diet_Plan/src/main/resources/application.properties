spring.application.name=Diet_Plan

FoodFileName : meta-data/food.txt


# Logging Configuration
logging.level.root=INFO
# Log file location
logging.file.name=A:/workspace/logs/diet-plan/application.log
# Rolling Policy
logging.logback.rollingpolicy.file-name-pattern=A:/workspace/logs/diet-plan/application-%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=100